site_name: "Intelligence Patterns: An Evolving Handbook on Agentic Design"
site_description: An interactive, live-updating book on Agentic Design Patterns.
site_author: George Kour
site_url: https://kourgeorge.github.io/agents-patterns-atlas/

repo_name: kourgeorge/agents-patterns-atlas
repo_url: https://github.com/kourgeorge/agents-patterns-atlas
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  extra_css:
    - assets/css/custom.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: en

nav:
- About: index.md
- Preface: preface.md
- Introduction & Foundations:
    - Introduction: introduction.md
    - What is an Agentic Design Pattern?: what-is-a-design-pattern.md
- Core Workflow:
    - "Pattern: Prompt Chaining": prompt-chaining.md
    - "Pattern: Routing": routing.md
    - "Pattern: Parallelization": parallelization.md
    - "Pattern: Reflection": reflection.md
- Tools:
    - "Pattern: Tool Use": tool-use.md
    - "Pattern: Shortlisting": shortlisting.md
    - "Pattern: Constrained Tool Use": constrained-tool-use.md
    - "Pattern: Tool Discovery": tool-discovery.md
- Reasoning & Planning:
    - Reasoning Techniques: reasoning-techniques.md
    - Planning Strategies: planning-strategies.md
    - "Pattern: Task Decomposition": task-decomposition.md
    - "Pattern: Recitation": recitation.md
    - "Pattern: Prioritization": prioritization.md
- Context and memory:
    - Memory Management: memory-management.md
    - Context Engineering: context-engineeting.md
    - "Pattern: Attention Engineering": attention-engineering.md
    - "Pattern: Context Editing": context-editing.md
    - "Pattern: Filesystem as Context": external-memory.md
    - "Pattern: RAG": knowledge-retrieval.md
    - "Pattern: Variables Manager": variables-manager.md
- Multi-Agent Systems:
    - Multi-Agent Architectures: multi-agent.md
    - "Pattern: Orchestrator-Worker": orchestrator-worker.md
    - "Pattern: Planner-Checker": planner-checker.md
    - "Pattern: Multi-Agent Debate": multi-agent-debate.md
    - "Pattern: Swarm/Consensus Architecture": swarm-consensus.md
- Human input and Recovery:
    - Learning and Adaptation: learning-adaptation.md
    - "Pattern: Exception Handling and Recovery": exception-handling.md
    - "Pattern: Human-in-the-Loop": human-in-the-loop.md
